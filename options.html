<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Define It — Settings</title>
    <link rel="stylesheet" href="dist/styles.css" />
  </head>
  <body class="m-0 box-border w-[360px] bg-neutral-900 text-neutral-50 font-sans p-8">
    <h1 class="text-[15px] font-bold tracking-wide m-0 mb-1">Define It</h1>
    <p class="text-[12.5px] text-neutral-400 leading-relaxed m-0 mb-4">
      Paste your Gemini API key below. Get one free at
      <a class="text-orange-400 hover:underline" href="https://aistudio.google.com/apikey" target="_blank" rel="noopener"
        >aistudio.google.com/apikey</a
      >. It's stored only in your browser's synced extension storage.
    </p>

    <label for="apiKey" class="block text-[11px] uppercase tracking-wider text-neutral-400 mb-1.5">
      Gemini API key
    </label>
    <input
      id="apiKey"
      type="password"
      placeholder="AIza..."
      autocomplete="off"
      class="box-border w-full px-2.5 py-2 mb-3 rounded-md border border-neutral-700 bg-neutral-800 text-neutral-50 text-[13px] focus:outline-none focus:ring-2 focus:ring-orange-400"
    />
    <button
      id="save"
      class="w-full px-2.5 py-2 rounded-md border-0 bg-orange-400 text-neutral-900 font-bold text-[13px] cursor-pointer hover:bg-orange-300 transition-colors"
    >
      Save key
    </button>
    <div id="status" class="mt-2.5 text-xs min-h-[14px] text-emerald-400"></div>

    <script src="dist/options.js"></script>
  </body>
</html>
